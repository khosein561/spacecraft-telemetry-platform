[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spacecraft-telemetry-platform"
version = "0.1.0"
description = "Spacecraft telemetry ingestion (CCSDS-style packets) and anomaly detection platform"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy", "pandas", "SQLAlchemy", "psycopg2-binary", "confluent-kafka", "torch", "matplotlib",
  "skyfield", "sgp4", "fastapi", "uvicorn", "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
